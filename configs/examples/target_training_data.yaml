# Multi-source target-raster workflow example.
#
# This override enables LiDAR, Google, latest Wayback, and CopDEM. Combine it
# with configs/default.yaml and the private CopDEM credentials file.
# LiDAR produces only an aligned high-resolution raster; LR generation belongs
# to the downstream super-resolution project.

region:
  class_path: geoacquire.regions.bounds.BoundsRegionProvider
  init_args:
    source: ./examples/USA_SanJuan_Example/input/USA_SanJuan_Example.tif
    region: null
    crs: EPSG:4326

pipelines:
  - name: usgs_lidar
    enable: true
    acquire:
      output_dir: ./examples/USA_SanJuan_Example/downloads/training/usgs_lidar
    postprocess:
      - init_args:
          output_dir: ./examples/USA_SanJuan_Example/results/training/usgs_lidar

  - name: google
    enable: true
    acquire:
      output_dir: ./examples/USA_SanJuan_Example/downloads/training/google
    postprocess:
      - init_args:
          output_dir: ./examples/USA_SanJuan_Example/results/training/google

  - name: wayback
    enable: true
    acquire:
      output_dir: ./examples/USA_SanJuan_Example/downloads/training/wayback
    postprocess:
      - init_args:
          output_dir: ./examples/USA_SanJuan_Example/results/training/wayback

  - name: copdem
    enable: true
    acquire:
      output_dir: ./examples/USA_SanJuan_Example/downloads/training/copdem
    postprocess:
      - init_args:
          output_dir: ./examples/USA_SanJuan_Example/results/training/copdem

reporting:
  log_path: ./examples/USA_SanJuan_Example/logs/target_training_data.log
  json_path: ./examples/USA_SanJuan_Example/logs/target_training_data_run.json
