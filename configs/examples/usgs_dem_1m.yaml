# 可直接编辑的 USGS 3DEP 1 m DEM 下载示例。
# 放在 configs/default.yaml 后加载；只需修改 source 和两个 output_dir。
# source 可以是 bbox、单个目标 TIF 或目标 TIF 目录。
#
#   python run.py -c configs/default.yaml configs/examples/usgs_dem_1m.yaml --check

region:
  init_args:
    source: ./examples/USA_SanJuan_Example/input/USA_SanJuan_Example.tif
    region: null
    crs: EPSG:4326

pipelines:
  - name: usgs_dem_1m
    enable: true
    acquire:
      output_dir: ./examples/USA_SanJuan_Example/downloads/usgs_dem_1m
    postprocess:
      - init_args:
          output_dir: ./examples/USA_SanJuan_Example/results/usgs_dem_1m

reporting:
  log_path: ./examples/USA_SanJuan_Example/logs/usgs_dem_1m.log
  json_path: ./examples/USA_SanJuan_Example/logs/usgs_dem_1m_run.json
