# 可直接编辑的 Google XYZ 影像下载示例。
# 放在 configs/default.yaml 后加载；只需修改 source 和两个 output_dir。
# source 可以是 bbox、单个目标 TIF 或目标 TIF 目录。
#
#   python run.py -c configs/default.yaml configs/examples/google.yaml --check

region:
  init_args:
    source: ./examples/USA_SanJuan_Example/input/USA_SanJuan_Example.tif
    region: null
    crs: EPSG:4326

pipelines:
  - name: google
    enable: true
    acquire:
      output_dir: ./examples/USA_SanJuan_Example/downloads/google
    postprocess:
      - init_args:
          output_dir: ./examples/USA_SanJuan_Example/results/google

reporting:
  log_path: ./examples/USA_SanJuan_Example/logs/google.log
  json_path: ./examples/USA_SanJuan_Example/logs/google_run.json
