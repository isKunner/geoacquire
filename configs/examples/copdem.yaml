# 可直接编辑的 Copernicus DEM 下载示例。
# 放在 configs/default.yaml 后加载，并把 configs/private_copdem.yaml 放在最后。
# 修改 source 和两个 output_dir；source 可以是 bbox、单个目标 TIF 或目标 TIF 目录。
#
#   python run.py -c configs/default.yaml configs/examples/copdem.yaml configs/private_copdem.yaml --check

region:
  init_args:
    source: ./examples/USA_SanJuan_Example/input/USA_SanJuan_Example.tif
    region: null
    crs: EPSG:4326

pipelines:
  - name: copdem
    enable: true
    acquire:
      output_dir: ./examples/USA_SanJuan_Example/downloads/copdem
    postprocess:
      - init_args:
          output_dir: ./examples/USA_SanJuan_Example/results/copdem

reporting:
  log_path: ./examples/USA_SanJuan_Example/logs/copdem.log
  json_path: ./examples/USA_SanJuan_Example/logs/copdem_run.json
