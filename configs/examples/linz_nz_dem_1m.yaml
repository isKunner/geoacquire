# LINZ New Zealand national LiDAR 1 m DEM example.
# This small Wellington bbox normally selects one native 1:50,000 COG.
# Replace BoundsRegionProvider with VectorRegionProvider when the New Zealand
# test SHP is available. Polygon/MultiPolygon geometry is preserved exactly.
# Each selected download remains the original full LINZ COG; postprocess is
# disabled here so this example performs acquisition only.
#
#   python run.py -c configs/default.yaml -c configs/examples/linz_nz_dem_1m.yaml --check

region:
  class_path: geoacquire.regions.bounds.BoundsRegionProvider
  init_args:
    source: [174.775, -41.295, 174.785, -41.285]
    region: wellington_sample
    crs: EPSG:4326

pipelines:
  - name: linz_nz_dem_1m
    enable: true
    acquire:
      output_dir: ./examples/New_Zealand_LINZ/download
    postprocess: []

reporting:
  log_path: ./examples/New_Zealand_LINZ/logs/linz_nz_dem_1m.log
  json_path: ./examples/New_Zealand_LINZ/logs/linz_nz_dem_1m_run.json
