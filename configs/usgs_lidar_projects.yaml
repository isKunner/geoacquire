# USGS LiDAR project filename catalogue.
#
# Formal downloads never inspect remote LAZ headers. Each supported workunit is
# listed here with a deterministic filename parser and grid model. Run the audit
# configuration first when a workunit is not listed, inspect its report, then add
# one reviewed entry here.
#
# Do not infer rules from project totals alone. Internal codes such as
# Goshen_0995 stay unmatched until a known filename footprint establishes their
# coordinate system, origin, scale, anchor, and tile size.
#
# match fields are regular expressions. Available fields:
#   workunit, project, lpc_link
#
# parser choices:
#   mgrs, mgrs_tokens, mgrs_zero_x_next_100km, mgrs_absolute_tokens,
#   mgrs_fixed_<zone><band>, mgrs_zero_x_columns_<letters>,
#   full_xy, axis_pair, axis_named_pair,
#   number_pair, ct_quadrant_2500ft, zone_tokens, zone_tokens_grid_<letters>,
#   single_number_split_<position>, odd_km_pair, fl_fdem_5000ft,
#   il_mchenry_2500ft, az_eastern_pima_5k, ca_san_diego_5k,
#   ca_eldorado_2500ft, ca_solano_2640ft, ca_upper_pit_5k,
#   mgrs_zone_11, id_southern_15, mgrs_zone14_legacy_columns, mgrs_separated_xy,
#   mn_utm_pair, nj_5000ft, mi_2500ft, mi_2500ft_wrapped,
#   nc_panel_5000ft, nc_panel_2500ft, nc_panel_1250ft, nh_2500ft,
#   mt_1000m_wrapped, tn_7000x4000ft, vt_1400m_legacy_center,
#   zone_full_xy, number_pair_date, pa_luzerne_2500ft, pa_dauphin_5000ft,
#   tx_lower_rio_500m, letter_row_number_column, sc_5000ft_quadrants,
#   sc_savannah_5000ft, sc_savannah_2500ft, axis_suffix_pair,
#   wi_sewrpc_10kft, wi_2500ft_quadrants, wa_thurston_4500ft
# See docs/DEVELOPER_HANDOFF.md for meanings and tests/fixtures/lidar_headers*.json
# for reviewed filename/bounds/CRS examples. Special parsers are opt-in only.
#
# crs choices:
#   mgrs       - UTM EPSG is decoded from each MGRS filename
#   workunit   - use WESM horiz_crs (EPSG is tried before ESRI)
#   EPSG:xxxxx - explicit CRS
# Grid sizes/offsets/padding use this horizontal CRS's units, not always metres.
# x/y_ceil_step, x/y_floor_step and x/y_round_step restore encoded grid corners;
# set at most one rounding direction per axis. They do not resample the data.
# x/y_grid_origin defaults to 0; a non-zero origin shifts the rounding lattice,
# not the coordinate. Example: ceil(738000 on 4500-ft lines through 530) = 738530.

version: 1
projects:
  - name: HI_NOAA_Maui_Oahu_2020
    match:
      workunit: ^HI_NOAAMauiOahu_[12]_B20$
    schemes:
      - parser: mgrs
        crs: mgrs
        grid: {x_scale: 1, y_scale: 1, x_offset: 0, y_offset: 0, x_anchor: min, y_anchor: min, width: 500, height: 500}

  - name: HI_Hawaii_Island_2017
    match:
      workunit: ^HI_Hawaii_Island_2017$
    schemes:
      # Local LAZ headers confirm standard MGRS coordinates and 1 km tiles.
      # Use WESM CRS to retain NAD83(PA11) / UTM zone 5N instead of WGS84 UTM.
      - parser: mgrs
        crs: workunit
        grid: {x_scale: 1, y_scale: 1, x_offset: 0, y_offset: 0, x_anchor: min, y_anchor: min, width: 1000, height: 1000}

  - name: DE_Statewide_B23
    match:
      workunit: ^DE_Statewide_1_B23$
    schemes:
      - parser: full_xy
        crs: EPSG:32618
        grid: {x_scale: 1, y_scale: 1, x_offset: 0, y_offset: 0, x_anchor: min, y_anchor: max, width: 1500, height: 1500}

  # These modern Massachusetts projects encode kilometre-level MGRS tokens,
  # while their 1.5 km tiles start on the next global 1.5 km grid line.
  - name: MA_modern_1500m_MGRS_tokens
    match:
      project: ^(MA_Western_B24|MA_CentralEastern_2021_B21)$
    schemes:
      - parser: mgrs_tokens
        crs: workunit
        grid: {x_scale: 1000, y_scale: 1000, x_offset: 0, y_offset: 4000000, x_anchor: min, y_anchor: min, width: 1500, height: 1500, x_ceil_step: 1500, y_ceil_step: 1500}

  # Connecticut names identify one 2.5 kft quadrant of a 5 kft parent cell.
  # Three-digit eastings wrap at one million feet (005 -> 1,005,000; 800 ->
  # 800,000), which is resolved by the reviewed Connecticut parser.
  - name: CT_Statewide_C16_quadrants
    match:
      project: ^CT_Statewide_C16$
    schemes:
      - parser: ct_quadrant_2500ft
        crs: workunit
        grid: {x_scale: 1, y_scale: 1, x_offset: 0, y_offset: 0, x_anchor: min, y_anchor: min, width: 2500, height: 2500, x_padding: 0.02, y_padding: 0.02}

  - name: CT_2023Statewide_C25_quadrants
