[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoacquire"
version = "0.1.0"
description = "YAML-driven geospatial data acquisition and target-raster alignment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonargparse>=4.50",
    "requests>=2.31",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "laspy[lazrs]>=2.5",
]

[tool.setuptools.packages.find]
include = ["geoacquire*"]
